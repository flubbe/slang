name: C/C++ CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Linux (x86_64 GCC 14)"
            os: ubuntu-latest
            compiler_family: gcc
            build_type: Release
            conan_preset: conan-release
            cppstd: gnu23

          - name: "macOS (Apple Silicon AArch64 Clang)"
            os: macos-latest
            compiler_family: clang
            build_type: Release
            conan_preset: conan-release
            cppstd: 23

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup GCC 14 (Linux)
        if: matrix.compiler_family == 'gcc'
        run: |
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100 --slave /usr/bin/g++ g++ /usr/bin/g++-14
          sudo update-alternatives --set gcc /usr/bin/gcc-14
          gcc --version
          g++ --version

      - name: Verify Apple Clang & Architecture (macOS)
        if: matrix.compiler_family == 'clang'
        run: |
          clang++ --version
          uname -m

      - name: Install Conan (macOS)
        if: runner.os == 'macOS'
        run: brew install conan

      - name: Install Conan (Linux)
        id: conan
        if: runner.os == 'Linux'
        uses: turtlebrowser/get-conan@main

      - name: Conan version
        run: echo "${{ steps.conan.outputs.version }}"

      - name: Create default profile
        run: conan profile detect

      - name: Install dependencies
        run: conan install . --build=missing -s compiler.cppstd=${{matrix.cppstd}} -s build_type=${{matrix.build_type}}

      - name: Configure CMake
        # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
        # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
        run: cmake --preset ${{matrix.conan_preset}}

      - name: Build
        run: cmake --build --preset ${{matrix.conan_preset}}

      - name: Run tests
        run: |
          ctest --test-dir ${{github.workspace}}/build/${{matrix.build_type}}/test --output-on-failure
